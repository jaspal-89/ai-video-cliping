services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-clipper-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    container_name: ai-clipper-app
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "7860:7860"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped

volumes:
  ollama_data:
